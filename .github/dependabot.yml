# Обновления зависимостей: раз в неделю, одним PR на экосистему (меньше шума).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups: { app: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /bot
    schedule: { interval: weekly }
    groups: { bot: { patterns: ["*"] } }
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
