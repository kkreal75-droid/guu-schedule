# Автотесты воркера (bot/test): подписи, права, ввод, лимиты — в рантайме Workers (Miniflare), без сети.
name: Tests

on:
  push:
    branches: [main]
    paths: ["bot/**", "shared/**", "overrides.json", "overrides/**", ".github/workflows/tests.yml"]
  pull_request:

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      - run: npx wrangler types
      - run: npx tsc --noEmit && npx tsc -p test --noEmit
      - run: npm test
